<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            height: 80px;
            margin:0 auto ;
            text-align: center;
        }
        th{
            padding: 5px 30px;
        }
        table,th,td{
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <h2>订单确认</h2>
    
    <script>
        //1.用户输入
        let pricd=+prompt('请输入商品价格')//在前面加一个加号可以将字符型变为数字型
        let cont=+prompt("请输入商品数量")
        let place=prompt("请输入联系地址")
        //2.计算总额
        let total=pricd*cont

        //3.页面打印渲染
        document.write(`
        <table >
        <tr>
            <th>商品名称</th>
            <th>商品价格</th>
            <th>商品数量</th>
            <th>总价</th>
            <th>收货地址</th>
        </tr>
        <tr>
            <td>小米青春版plus</td>
            <td>${pricd}元</td>
            <td>${cont}</td>
            <td>${total}元</td>
            <td>${place}</td>
        </tr>
    </table>
        `)//document.write表示打印输出
    </script>
</body>
</html>
